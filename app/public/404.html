<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RISIQ EV Solutions</title>
    <script>
      /* Stash the requested deep link, then hand control back to the SPA.
         Legacy static URLs (/verify.html?id=…) map onto the SPA routes. */
      var p = location.pathname, m = p.match(/^\/([a-z-]+)\.html$/i)
      if (m) p = m[1] === 'index' ? '/' : '/' + m[1]
      sessionStorage.setItem('spa-redirect', p + location.search + location.hash)
      location.replace(document.querySelector('base')?.href || '/')
    </script>
  </head>
  <body></body>
</html>
