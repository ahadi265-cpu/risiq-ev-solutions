<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A micro-finance branch on an Addis Ababa street, with an awning, a queue of customers and a delivery motorbike.">
  <defs>
    <linearGradient id="mfSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2edf3"/><stop offset="60%" stop-color="#f1f5f6"/><stop offset="100%" stop-color="#f8f4ec"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#mfSky)"/>
  <circle cx="150" cy="112" r="46" fill="#f8d9a8" opacity="0.5"/>

  <!-- neighbours -->
  <rect x="0" y="222" width="128" height="256" fill="#dfe7ee"/>
  <rect x="672" y="248" width="128" height="230" fill="#dfe7ee"/>
  <g fill="#c3d2de">
    <rect x="20" y="252" width="34" height="42"/><rect x="72" y="252" width="34" height="42"/>
    <rect x="20" y="318" width="34" height="42"/><rect x="72" y="318" width="34" height="42"/>
    <rect x="700" y="278" width="34" height="42"/><rect x="748" y="278" width="34" height="42"/>
  </g>

  <!-- branch shell -->
  <rect x="128" y="182" width="546" height="296" fill="#ffffff"/>
  <rect x="128" y="182" width="546" height="296" fill="#0b1524" opacity="0.03"/>
  <rect x="128" y="182" width="546" height="46" fill="#0f766e"/>
  <g fill="#ffffff" opacity="0.92">
    <rect x="156" y="199" width="96" height="12" rx="6"/><rect x="264" y="199" width="60" height="12" rx="6"/>
    <rect x="336" y="199" width="78" height="12" rx="6"/>
  </g>
  <rect x="128" y="228" width="546" height="6" fill="#0b1524" opacity="0.2"/>

  <!-- striped awning -->
  <path d="M136 234 L666 234 L636 300 L166 300 Z" fill="#e8871e"/>
  <g fill="#ffffff" opacity="0.85">
    <path d="M212 234 L246 234 L222 300 L188 300 Z"/>
    <path d="M304 234 L338 234 L314 300 L280 300 Z"/>
    <path d="M396 234 L430 234 L406 300 L372 300 Z"/>
    <path d="M488 234 L522 234 L498 300 L464 300 Z"/>
    <path d="M580 234 L614 234 L590 300 L556 300 Z"/>
  </g>
  <rect x="166" y="298" width="470" height="7" fill="#b45309" opacity="0.55"/>

  <!-- windows + door -->
  <rect x="176" y="326" width="164" height="118" fill="#cfe3e0"/>
  <rect x="176" y="326" width="164" height="118" fill="#0f766e" opacity="0.14"/>
  <rect x="176" y="326" width="72" height="118" fill="#ffffff" opacity="0.3"/>
  <rect x="462" y="326" width="164" height="118" fill="#cfe3e0"/>
  <rect x="462" y="326" width="164" height="118" fill="#0f766e" opacity="0.14"/>
  <rect x="462" y="326" width="72" height="118" fill="#ffffff" opacity="0.3"/>
  <rect x="366" y="318" width="70" height="160" fill="#14424a"/>
  <rect x="399" y="318" width="4" height="160" fill="#ffffff" opacity="0.35"/>
  <circle cx="390" cy="400" r="4" fill="#f5a949"/>

  <!-- ground -->
  <rect x="0" y="478" width="800" height="122" fill="#e6e0d4"/>
  <rect x="0" y="478" width="800" height="8" fill="#d3ccbc"/>
  <rect x="0" y="540" width="800" height="4" fill="#d9d2c4"/>

  <!-- queue -->
  <g fill="#2b3a4d">
    <circle cx="238" cy="404" r="11"/><path d="M225 478v-42a13 13 0 0 1 26 0v42z"/>
  </g>
  <g fill="#46556b">
    <circle cx="284" cy="412" r="10"/><path d="M272 478v-38a12 12 0 0 1 24 0v38z"/>
  </g>
  <g fill="#3d4d63">
    <circle cx="326" cy="408" r="10"/><path d="M314 478v-40a12 12 0 0 1 24 0v40z"/>
  </g>
  <g fill="#0b1524" opacity="0.12">
    <ellipse cx="238" cy="482" rx="22" ry="5"/><ellipse cx="284" cy="482" rx="20" ry="5"/><ellipse cx="326" cy="482" rx="20" ry="5"/>
  </g>

  <!-- motorbike -->
  <g>
    <circle cx="546" cy="452" r="26" fill="none" stroke="#2b3a4d" stroke-width="7"/>
    <circle cx="648" cy="452" r="26" fill="none" stroke="#2b3a4d" stroke-width="7"/>
    <path d="M546 452 L588 414 L634 414 L648 452" fill="none" stroke="#0f766e" stroke-width="8" stroke-linejoin="round"/>
    <rect x="584" y="398" width="46" height="18" rx="5" fill="#e8871e"/>
    <path d="M634 414 L654 392" stroke="#2b3a4d" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="597" cy="484" rx="60" ry="6" fill="#0b1524" opacity="0.1"/>
  </g>
</svg>
