  <g fill="#2b3a4d">
    <circle cx="612" cy="428" r="10"/><path d="M600 482v-40a12 12 0 0 1 24 0v40z"/>
    <circle cx="204" cy="432" r="10"/><path d="M192 482v-38a12 12 0 0 1 24 0v38z"/>
