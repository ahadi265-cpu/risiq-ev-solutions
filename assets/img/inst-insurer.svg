<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="An insurance company office tower with a shield motif on its entrance canopy.">
  <defs>
    <linearGradient id="inSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde9f3"/><stop offset="64%" stop-color="#eef3f7"/><stop offset="100%" stop-color="#f6f3ed"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#inSky)"/>
  <circle cx="672" cy="126" r="50" fill="#f8d9a8" opacity="0.5"/>

  <g fill="#cbd9e5" opacity="0.55">
    <rect x="30" y="300" width="66" height="182"/><rect x="712" y="322" width="62" height="160"/>
  </g>

  <!-- tower -->
  <rect x="222" y="96" width="356" height="386" fill="#152a42"/>
  <rect x="222" y="96" width="120" height="386" fill="#ffffff" opacity="0.06"/>
  <rect x="222" y="82" width="356" height="18" fill="#0b1524"/>

  <!-- window grid -->
  <g fill="#5eead4" opacity="0.5">
    <rect x="246" y="126" width="42" height="30"/><rect x="304" y="126" width="42" height="30"/>
    <rect x="362" y="126" width="42" height="30"/><rect x="420" y="126" width="42" height="30"/><rect x="478" y="126" width="42" height="30"/>
    <rect x="246" y="180" width="42" height="30"/><rect x="362" y="180" width="42" height="30"/><rect x="478" y="180" width="42" height="30"/>
    <rect x="304" y="234" width="42" height="30"/><rect x="420" y="234" width="42" height="30"/><rect x="536" y="234" width="26" height="30"/>
    <rect x="246" y="288" width="42" height="30"/><rect x="362" y="288" width="42" height="30"/><rect x="478" y="288" width="42" height="30"/>
    <rect x="304" y="342" width="42" height="30"/><rect x="420" y="342" width="42" height="30"/>
  </g>
  <g fill="#f5a949" opacity="0.75">
    <rect x="536" y="126" width="26" height="30"/><rect x="304" y="180" width="42" height="30"/>
    <rect x="246" y="234" width="42" height="30"/><rect x="536" y="288" width="26" height="30"/>
    <rect x="246" y="342" width="42" height="30"/><rect x="536" y="342" width="26" height="30"/>
  </g>

  <!-- entrance canopy + shield -->
  <rect x="186" y="386" width="428" height="26" fill="#0f766e"/>
  <rect x="262" y="412" width="276" height="70" fill="#ffffff" opacity="0.94"/>
  <rect x="262" y="412" width="276" height="70" fill="#0b1524" opacity="0.05"/>
  <rect x="352" y="424" width="96" height="58" fill="#14424a"/>
  <rect x="398" y="424" width="4" height="58" fill="#ffffff" opacity="0.4"/>

  <g transform="translate(400 322)">
    <path d="M0 -46 L38 -30 v30 c0 26-18 41-38 47-20-6-38-21-38-47v-30z" fill="#e8871e"/>
    <path d="M-15 4 l11 11 20-24" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ground -->
  <rect x="0" y="482" width="800" height="118" fill="#e7e1d5"/>
  <rect x="0" y="482" width="800" height="8" fill="#d4cdbd"/>

